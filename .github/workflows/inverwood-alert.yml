name: Inver Wood Alert

# One-off weekend watcher: Inver Wood, Sat Jun 27, 4:00-5:20 PM tee times.
# Emails + texts (Verizon vtext) every ~3 min while slots are open.
# The script self-disables after Sat Jun 27 2:00 PM CT; this cron window is
# scoped to Fri-Sat UTC so we don't burn runners the rest of the time.
# DELETE THIS WORKFLOW after the weekend.

on:
  schedule:
    # Every 3 minutes, only during Jun 25-27 UTC (covers now through Sat 2pm CT).
    # GitHub cron is best-effort and may delay/skip runs under load.
    - cron: "*/3 * 25,26,27 6 *"
  workflow_dispatch: {}

concurrency:
  group: inverwood-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Check Inver Wood and alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python inverwood_alert.py
