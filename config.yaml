# Tee Time Scout configuration
# ─────────────────────────────
# Courses are listed in order of importance; the email digest follows this order.
#
# Each course has:
#   provider: chronogolf | foreup | teeitup | cps | generic_json
#   rules:    list of {days: [...], window: "HH:MM-HH:MM"} — a tee time matches
#             if it falls inside ANY rule. Days not covered by any rule are skipped.
#   booking_url: link shown in the email so you can book in one tap.
#
# days values: mon tue wed thu fri sat sun (or the shortcuts "weekdays"/"weekend")

settings:
  timezone: America/Chicago
  days_ahead: 10         # default search horizon for courses without a booking_window
  min_open_spots: 2      # only show times with at least this many open slots
  holes: 18

email:
  subject_prefix: "⛳ Tee Time Scout"
  # Sender/recipient/app-password come from environment variables / GitHub secrets:
  #   GMAIL_ADDRESS, GMAIL_APP_PASSWORD, TO_EMAIL

courses:

  - name: Inver Wood Championship
    provider: generic_json          # TeeWire — endpoint from live capture
    booking_window: 7               # official: 7 days in advance
    booking_url: https://teewire.app/inverwood/index.php?controller=FrontV2&action=load&cid=3&view=list
    generic:
      url_template: "https://teewire.app/inverwood/online/application/web/api/golf-api.php?action=tee-times&calendar_id=3&date={date}&starting_tee=1"
      list_path: "data.tee_times"
      time_field: time              # "06:20:00"
      time_format: auto
      spots_field: "availability.available_spots"
      price_field: "price"          # may not exist in payload; harmless if absent
      headers:
        Referer: "https://teewire.app/inverwood/index.php?controller=FrontV2&action=load&cid=3&view=list"
    rules:
      - { days: [mon, tue, wed, thu, fri, sat, sun], window: "10:00-19:00" }

  - name: Braemar Championship
    provider: foreup
    booking_window: 8            # 7 by phone, 8 online (per City of Edina)
    booking_url: https://foreupsoftware.com/index.php/booking/21445/7829#teetimes
    foreup:
      course_id: 21445
      schedule_id: 7829
      booking_class: null           # auto-discovered from the booking page if null
    rules:
      - { days: [mon, tue, wed, thu], window: "11:00-19:00" }
      - { days: [fri, sat, sun],      window: "09:00-18:30" }

  - name: Keller Golf Course
    provider: teeitup
    booking_window: { weekdays: 7, weekends: 4 }   # Ramsey County splits these
    booking_url: https://ramsey-county-golf.book.teeitup.com/?course=17055
    teeitup:
      alias: ramsey-county-golf
      facility_id: 17055
    rules:
      - { days: [mon, tue, wed, thu, fri], window: "12:00-19:00" }
      - { days: [sat, sun],                window: "09:00-18:00" }

