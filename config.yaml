  - name: Chomonix Golf Course
    provider: webtrac               # Vermont Systems WebTrac (Anoka County)
    booking_window: 10              # official: public 10 days (Players Club 15, members 21)
    booking_url: https://web2.myvscloud.com/wbwsc/mnanokactywt.wsc/search.html?display=detail&module=GR&secondarycode=1
    webtrac:
      search_url: https://web2.myvscloud.com/wbwsc/mnanokactywt.wsc/search.html
      params:
        display: detail
        module: GR
        secondarycode: "1"
      date_param: begindate
      date_format: "%m/%d/%Y"
    # DEFAULT windows — adjust to taste. Note Chomonix league blackouts:
    # Mon 4:00-6:30pm, Tue 8-10am, Wed 7-11am & 2pm-close, Thu 1pm-close
    rules:
      - { days: [mon, tue, wed, thu, fri], window: "11:00-19:00" }
