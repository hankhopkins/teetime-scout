<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛳ Tee Time Scout</title>
<style>
  :root {
    --green: #1b4332;
    --green-dark: #143226;
    --gold: #c9a227;
    --cream: #faf7ef;
    --border: #e4ddcc;
    --chip-border: #d8cfa9;
    --muted: #8a8472;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: #2b2b2b;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 10px 60px; }

  header {
    background: var(--green);
    color: var(--cream);
    padding: 26px 26px 22px;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header .sub { color: var(--gold); font-size: 13.5px; margin-top: 6px; }

  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 18px 2px 14px;
  }
  .controls label { font-size: 14px; color: var(--green); font-weight: 700; }
  select {
    font-family: inherit; font-size: 15px;
    padding: 9px 12px; border: 1px solid var(--chip-border);
    border-radius: 8px; background: #fff; color: #2b2b2b;
    max-width: 100%; flex: 1; min-width: 220px;
  }

  .course {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 14px 0;
    overflow: hidden;
  }
  .course-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .course-head h2 { margin: 0; font-size: 18px; color: var(--green); }
  .course-head .count { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .book-btn {
    background: var(--green); color: var(--cream);
    text-decoration: none; font-size: 13.5px; font-weight: 700;
    padding: 8px 14px; border-radius: 8px; white-space: nowrap;
  }
  .book-btn:hover { background: var(--green-dark); }

  .course-body { padding: 8px 18px 14px; }
  .day { margin: 10px 0 4px; }
  .day-label {
    font-size: 14.5px; font-weight: 700; color: #555;
    border-bottom: 1px dashed var(--chip-border);
    padding-bottom: 3px; margin-bottom: 6px;
  }
  details.bucket {
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--cream);
  }
  details.bucket > summary {
    cursor: pointer; list-style: none;
    padding: 9px 12px; font-size: 14px; color: var(--green);
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  details.bucket > summary::-webkit-details-marker { display: none; }
  details.bucket > summary .badge {
    background: var(--green); color: var(--cream);
    border-radius: 999px; font-size: 12px; padding: 2px 10px;
  }
  details.bucket > summary .arrow { transition: transform .15s; margin-right: 8px; color: var(--gold); }
  details.bucket[open] > summary .arrow { transform: rotate(90deg); }
  .bucket-name { flex: 1; }
  .chips { padding: 4px 12px 12px; }
  .chip {
    display: inline-block; background: #fff;
    border: 1px solid var(--chip-border); border-radius: 6px;
    padding: 4px 9px; margin: 3px 4px 3px 0;
    font-size: 13px; color: #333;
  }
  .chip b { color: var(--green); }

  .none, .warn {
    font-size: 13.5px; color: var(--muted); padding: 6px 0 10px;
  }
  .warn { color: #a33; }
  .warn a { color: #a33; }

  footer { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 26px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛳ Tee Time Scout</h1>
    <div class="sub" id="updated">Loading…</div>
  </header>

  <div class="controls">
    <label for="courseSelect">Course</label>
    <select id="courseSelect"><option value="__all__">All courses</option></select>
  </div>

  <div id="content"><div class="loading">Fetching the tee sheet…</div></div>

  <footer>Generated by Tee Time Scout · courses configured in config.yaml</footer>
</div>

<script>
const BUCKETS = [
  { key: 'morning',      label: 'Morning',      test: h => h < 10 },
  { key: 'late-morning', label: 'Late Morning', test: h => h >= 10 && h < 12 },
  { key: 'afternoon',    label: 'Afternoon',    test: h => h >= 12 && h < 16 },
  { key: 'evening',      label: 'Evening',      test: h => h >= 16 },
];

let DATA = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ap;
}

function dayKey(iso) { return iso.slice(0, 10); }

function fmtDay(key) {
  const [y, mo, da] = key.split('-').map(Number);
  const d = new Date(y, mo - 1, da);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function chip(t) {
  const bits = ['<b>' + fmtTime(t.when) + '</b>'];
  if (t.price != null) bits.push('$' + Math.round(t.price));
  if (t.spots != null) bits.push(t.spots + ' open');
  if (t.holes != null && t.holes !== 18) bits.push(t.holes + ' holes');
  return '<span class="chip">' + bits.join(' · ') + '</span>';
}

function renderCourse(c) {
  const n = c.times.length;
  let html = '<div class="course"><div class="course-head"><h2>' + esc(c.name) +
    '<span class="count">' + n + ' time' + (n !== 1 ? 's' : '') + '</span></h2>';
  if (c.booking_url) {
    html += '<a class="book-btn" target="_blank" rel="noopener" href="' +
      esc(c.booking_url) + '">Book at course ↗</a>';
  }
  html += '</div><div class="course-body">';

  if (c.note) html += '<div class="none">' + esc(c.note) + '</div>';

  if (c.link_only) {
    html += '<div class="none">Live tee sheet not available for this course — use the booking link.</div>';
  } else if (c.errors && c.errors.length) {
    html += '<div class="warn">⚠ ' + esc(c.errors[0]) +
      (c.booking_url ? ' — <a target="_blank" rel="noopener" href="' + esc(c.booking_url) + '">check manually</a>' : '') +
      '</div>';
  }

  if (n) {
    const byDay = {};
    for (const t of c.times) (byDay[dayKey(t.when)] ??= []).push(t);
    for (const day of Object.keys(byDay).sort()) {
      html += '<div class="day"><div class="day-label">' + fmtDay(day) + '</div>';
      for (const b of BUCKETS) {
        const ts = byDay[day].filter(t => b.test(new Date(t.when).getHours()));
        if (!ts.length) continue;
        html += '<details class="bucket"><summary><span class="arrow">▶</span>' +
          '<span class="bucket-name">' + b.label + '</span>' +
          '<span class="badge">' + ts.length + '</span></summary><div class="chips">' +
          ts.map(chip).join('') + '</div></details>';
      }
      html += '</div>';
    }
  } else if (!c.link_only && !(c.errors && c.errors.length)) {
    html += '<div class="none">No open tee times found in the booking window.</div>';
  }

  html += '</div></div>';
  return html;
}

function render() {
  const sel = document.getElementById('courseSelect').value;
  const courses = sel === '__all__'
    ? DATA.courses
    : DATA.courses.filter(c => c.name === sel);
  document.getElementById('content').innerHTML =
    courses.map(renderCourse).join('') ||
    '<div class="loading">No courses to show.</div>';
}

async function init() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    DATA = await resp.json();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">Could not load data.json — has the first scrape run yet?</div>';
    return;
  }
  document.getElementById('updated').textContent =
    'Updated ' + DATA.generated_at_display + ' · ' + DATA.total_times +
    ' open tee time' + (DATA.total_times !== 1 ? 's' : '') + ' across ' +
    DATA.courses.length + ' courses';

  const select = document.getElementById('courseSelect');
  for (const c of DATA.courses) {
    const o = document.createElement('option');
    o.value = c.name;
    o.textContent = c.name + (c.times.length ? ' (' + c.times.length + ')' : '');
    select.appendChild(o);
  }
  select.addEventListener('change', render);
  render();
}
init();
</script>
</body>
</html>
