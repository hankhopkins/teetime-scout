<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛳ Tee Time Scout</title>
<style>
  :root {
    --green: #1b4332;
    --green-dark: #143226;
    --gold: #c9a227;
    --cream: #faf7ef;
    --border: #e4ddcc;
    --chip-border: #d8cfa9;
    --muted: #8a8472;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: #2b2b2b;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 10px 60px; }

  header {
    background: var(--green);
    color: var(--cream);
    padding: 26px 26px 22px;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header .sub { color: var(--gold); font-size: 13.5px; margin-top: 6px; }

  .controls {
    display: flex; flex-direction: column; gap: 12px;
    margin: 18px 2px 14px;
  }
  .ctl-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ctl-row > label { font-size: 14px; color: var(--green); font-weight: 700; min-width: 64px; }
  select {
    font-family: inherit; font-size: 15px;
    padding: 9px 12px; border: 1px solid var(--chip-border);
    border-radius: 8px; background: #fff; color: #2b2b2b;
    max-width: 100%; flex: 1; min-width: 200px;
  }
  .filter-chip {
    font-family: inherit; font-size: 13.5px; cursor: pointer;
    padding: 7px 13px; border: 1px solid var(--chip-border);
    border-radius: 999px; background: #fff; color: #555;
    user-select: none; transition: all .12s;
  }
  .filter-chip:hover { border-color: var(--green); }
  .filter-chip.on {
    background: var(--green); color: var(--cream); border-color: var(--green);
  }
  .ctl-row .spacer { flex: 1; }
  .clear-btn {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: none; border: none; color: var(--muted);
    text-decoration: underline; padding: 4px;
  }
  .clear-btn:hover { color: var(--green); }
  #spotsSelect { flex: 0 0 auto; min-width: 0; }

  .course {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 14px 0;
    overflow: hidden;
  }
  .course-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .course-head h2 { margin: 0; font-size: 18px; color: var(--green); }
  .course-head .count { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .book-btn {
    background: var(--green); color: var(--cream);
    text-decoration: none; font-size: 13.5px; font-weight: 700;
    padding: 8px 14px; border-radius: 8px; white-space: nowrap;
  }
  .book-btn:hover { background: var(--green-dark); }

  .course-body { padding: 8px 18px 14px; }
  .day { margin: 10px 0 4px; }
  .day-label {
    font-size: 14.5px; font-weight: 700; color: #555;
    border-bottom: 1px dashed var(--chip-border);
    padding-bottom: 3px; margin-bottom: 6px;
  }
  details.bucket {
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--cream);
  }
  details.bucket > summary {
    cursor: pointer; list-style: none;
    padding: 9px 12px; font-size: 14px; color: var(--green);
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  details.bucket > summary::-webkit-details-marker { display: none; }
  details.bucket > summary .badge {
    background: var(--green); color: var(--cream);
    border-radius: 999px; font-size: 12px; padding: 2px 10px;
  }
  details.bucket > summary .arrow { transition: transform .15s; margin-right: 8px; color: var(--gold); }
  details.bucket[open] > summary .arrow { transform: rotate(90deg); }
  .bucket-name { flex: 1; }
  .chips { padding: 4px 12px 12px; }
  .chip {
    display: inline-block; background: #fff;
    border: 1px solid var(--chip-border); border-radius: 6px;
    padding: 4px 9px; margin: 3px 4px 3px 0;
    font-size: 13px; color: #333;
  }
  .chip b { color: var(--green); }

  .none, .warn {
    font-size: 13.5px; color: var(--muted); padding: 6px 0 10px;
  }
  .warn { color: #a33; }
  .warn a { color: #a33; }

  footer { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 26px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛳ Tee Time Scout</h1>
    <div class="sub" id="updated">Loading…</div>
  </header>

  <div class="controls">
    <div class="ctl-row">
      <label for="courseSelect">Course</label>
      <select id="courseSelect"><option value="__all__">All courses</option></select>
    </div>
    <div class="ctl-row" id="timeChips">
      <label>Time</label>
      <button class="filter-chip" data-bucket="morning">Morning</button>
      <button class="filter-chip" data-bucket="late-morning">Late Morning</button>
      <button class="filter-chip" data-bucket="afternoon">Afternoon</button>
      <button class="filter-chip" data-bucket="evening">Evening</button>
    </div>
    <div class="ctl-row" id="dayChips">
      <label>Days</label>
      <button class="filter-chip" data-dow="0">Sun</button>
      <button class="filter-chip" data-dow="1">Mon</button>
      <button class="filter-chip" data-dow="2">Tue</button>
      <button class="filter-chip" data-dow="3">Wed</button>
      <button class="filter-chip" data-dow="4">Thu</button>
      <button class="filter-chip" data-dow="5">Fri</button>
      <button class="filter-chip" data-dow="6">Sat</button>
    </div>
    <div class="ctl-row">
      <label for="spotsSelect">Spots</label>
      <select id="spotsSelect">
        <option value="0">Any</option>
        <option value="2">2+</option>
        <option value="3">3+</option>
        <option value="4">4</option>
      </select>
      <span class="spacer"></span>
      <button class="clear-btn" id="clearFilters">Clear filters</button>
    </div>
  </div>

  <div id="content"><div class="loading">Fetching the tee sheet…</div></div>

  <footer>Generated by Tee Time Scout · courses configured in config.yaml</footer>
</div>

<script>
const BUCKETS = [
  { key: 'morning',      label: 'Morning',      test: h => h < 10 },
  { key: 'late-morning', label: 'Late Morning', test: h => h >= 10 && h < 12 },
  { key: 'afternoon',    label: 'Afternoon',    test: h => h >= 12 && h < 16 },
  { key: 'evening',      label: 'Evening',      test: h => h >= 16 },
];

let DATA = null;
const FILTERS = { buckets: new Set(), days: new Set(), minSpots: 0 };

function bucketOf(hour) {
  for (const b of BUCKETS) if (b.test(hour)) return b.key;
  return null;
}

function passesFilters(t) {
  const d = new Date(t.when);
  if (FILTERS.buckets.size && !FILTERS.buckets.has(bucketOf(d.getHours())))
    return false;
  if (FILTERS.days.size && !FILTERS.days.has(d.getDay())) return false;
  if (FILTERS.minSpots && (t.spots == null || t.spots < FILTERS.minSpots))
    return false;
  return true;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ap;
}

function dayKey(iso) { return iso.slice(0, 10); }

function fmtDay(key) {
  const [y, mo, da] = key.split('-').map(Number);
  const d = new Date(y, mo - 1, da);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function chip(t) {
  const bits = ['<b>' + fmtTime(t.when) + '</b>'];
  if (t.price != null) bits.push('$' + Math.round(t.price));
  if (t.spots != null) bits.push(t.spots + ' open');
  if (t.holes != null && t.holes !== 18) bits.push(t.holes + ' holes');
  return '<span class="chip">' + bits.join(' · ') + '</span>';
}

function renderCourse(c) {
  const filtered = c.times.filter(passesFilters);
  const n = filtered.length;
  const anyFilter = FILTERS.buckets.size || FILTERS.days.size || FILTERS.minSpots;
  let html = '<div class="course"><div class="course-head"><h2>' + esc(c.name) +
    '<span class="count">' + n + ' time' + (n !== 1 ? 's' : '') +
    (anyFilter && c.times.length !== n ? ' of ' + c.times.length : '') +
    '</span></h2>';
  if (c.booking_url) {
    html += '<a class="book-btn" target="_blank" rel="noopener" href="' +
      esc(c.booking_url) + '">Book at course ↗</a>';
  }
  html += '</div><div class="course-body">';

  if (c.note) html += '<div class="none">' + esc(c.note) + '</div>';

  if (c.link_only) {
    html += '<div class="none">Live tee sheet not available for this course — use the booking link.</div>';
  } else if (c.errors && c.errors.length) {
    html += '<div class="warn">⚠ ' + esc(c.errors[0]) +
      (c.booking_url ? ' — <a target="_blank" rel="noopener" href="' + esc(c.booking_url) + '">check manually</a>' : '') +
      '</div>';
  }

  if (n) {
    const byDay = {};
    for (const t of filtered) (byDay[dayKey(t.when)] ??= []).push(t);
    for (const day of Object.keys(byDay).sort()) {
      html += '<div class="day"><div class="day-label">' + fmtDay(day) + '</div>';
      for (const b of BUCKETS) {
        const ts = byDay[day].filter(t => b.test(new Date(t.when).getHours()));
        if (!ts.length) continue;
        html += '<details class="bucket"><summary><span class="arrow">▶</span>' +
          '<span class="bucket-name">' + b.label + '</span>' +
          '<span class="badge">' + ts.length + '</span></summary><div class="chips">' +
          ts.map(chip).join('') + '</div></details>';
      }
      html += '</div>';
    }
  } else if (c.link_only) {
    /* message already shown above */
  } else if (c.errors && c.errors.length) {
    /* warning already shown above */
  } else if (anyFilter && c.times.length) {
    html += '<div class="none">No tee times match the current filters.</div>';
  } else {
    html += '<div class="none">No open tee times found in the booking window.</div>';
  }

  html += '</div></div>';
  return html;
}

function updateHeaderCount() {
  let shown = 0, total = 0;
  for (const c of DATA.courses) {
    total += c.times.length;
    shown += c.times.filter(passesFilters).length;
  }
  const anyFilter = FILTERS.buckets.size || FILTERS.days.size || FILTERS.minSpots;
  const base = 'Updated ' + DATA.generated_at_display + ' · ';
  document.getElementById('updated').textContent = anyFilter
    ? base + shown + ' of ' + total + ' tee times match'
    : base + total + ' open tee time' + (total !== 1 ? 's' : '') +
      ' across ' + DATA.courses.length + ' courses';
}

function render() {
  const sel = document.getElementById('courseSelect').value;
  const courses = sel === '__all__'
    ? DATA.courses
    : DATA.courses.filter(c => c.name === sel);
  document.getElementById('content').innerHTML =
    courses.map(renderCourse).join('') ||
    '<div class="loading">No courses to show.</div>';
  updateHeaderCount();
}

function wireFilters() {
  document.querySelectorAll('#timeChips .filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.bucket;
      if (FILTERS.buckets.has(k)) { FILTERS.buckets.delete(k); btn.classList.remove('on'); }
      else { FILTERS.buckets.add(k); btn.classList.add('on'); }
      render();
    });
  });
  document.querySelectorAll('#dayChips .filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const dow = parseInt(btn.dataset.dow, 10);
      if (FILTERS.days.has(dow)) { FILTERS.days.delete(dow); btn.classList.remove('on'); }
      else { FILTERS.days.add(dow); btn.classList.add('on'); }
      render();
    });
  });
  document.getElementById('spotsSelect').addEventListener('change', e => {
    FILTERS.minSpots = parseInt(e.target.value, 10) || 0;
    render();
  });
  document.getElementById('clearFilters').addEventListener('click', () => {
    FILTERS.buckets.clear(); FILTERS.days.clear(); FILTERS.minSpots = 0;
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('on'));
    document.getElementById('spotsSelect').value = '0';
    render();
  });
}

async function init() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    DATA = await resp.json();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">Could not load data.json — has the first scrape run yet?</div>';
    return;
  }

  const select = document.getElementById('courseSelect');
  for (const c of DATA.courses) {
    const o = document.createElement('option');
    o.value = c.name;
    o.textContent = c.name + (c.times.length ? ' (' + c.times.length + ')' : '');
    select.appendChild(o);
  }
  select.addEventListener('change', render);
  wireFilters();
  render();
}
init();
</script>
</body>
</html>
